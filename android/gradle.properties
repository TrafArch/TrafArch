org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# AGP 9 legacy 兼容模式，与 Flutter 3.44+ 官方模板/migrator 默认一致；
# builtInKotlin=true 需要 Flutter 3.47+ 且所有 pub 插件完成迁移，暂不启用。
android.builtInKotlin=false
android.newDsl=false

# mobile_scanner：MLKit 二维码扫描改用非捆绑版（体积约 +600KB，而非捆绑版 +3~10MB），
# 识别模型首次使用时经 Google Play 服务下载。若目标设备无 GMS，删除此行以恢复捆绑版。
dev.steenbakker.mobile_scanner.useUnbundled=true

# Windows 下偶发 "Could not close incremental caches"（缓存 .tab 文件被锁）；
# 禁用 Kotlin 增量编译规避，代价是插件 Kotlin 任务全量编译。
kotlin.incremental=false

# TrafArch 交通数据库（TrafArch_Database_CU/TU.sqlite）的"最新版"维护目录；
# 每次构建（gradle 驱动的 flutter build / IDE 构建）会自动同步到 assets/data。
# 未配置或目录不存在时跳过同步，直接使用仓库内的资产，不影响其他协作者。
transitDbMasterDir=D:\iteam\TrafArch\assets\data
