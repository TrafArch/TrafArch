name: transit_card_analyzer
description: "TrafArch - NFC 交通卡读取与分析"
publish_to: 'none'
version: 1.0.1-beta.2+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dynamic_color: ^1.7.0
  path_provider: ^2.1.5
  flutter_floating_bottom_bar: ^3.0.0
  google_nav_bar: ^5.0.7
  mobile_scanner: ^7.1.3
  # 纯 Dart 二维码解码（ZXing 移植）：MLKit 不可用（无 Google Play 服务 / 无法联网）时的兜底
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 测试用：生成二维码图案
  qr: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icon/
