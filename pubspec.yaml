name: transit_card_analyzer
description: "TrafArch - NFC 交通卡读取与分析"
publish_to: 'none'
version: 1.0.1-alpha+2085

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 2.x 已迁移至 material_ui（Material 从 SDK 剥离后的官方独立包），其回调
  # 提供的 ColorScheme 与项目仍在使用的内置 flutter/material 类型不兼容；
  # 锁定 1.9.x（最后的内置 Material 版本），待项目整体迁移 material_ui 后再升。
  dynamic_color: ^1.9.0
  path_provider: ^2.1.6
  flutter_floating_bottom_bar: ^3.0.0
  mobile_scanner: ^7.4.2
  # 调用系统默认浏览器/外部应用打开链接（QQ 加群跳转）
  url_launcher: ^6.3.3
  # 应用内打开问卷（内嵌 WebView，不跳转外部浏览器）
  webview_flutter: ^4.14.1
  # 纯 Dart 二维码解码（ZXing 移植）：MLKit 不可用（无 Google Play 服务 / 无法联网）时的兜底
  zxing2: ^0.2.4

  # 卡片档案持久化（Drift + SQLite）：正式卡名 / 用户自定义名称等卡片数据，
  # 后续交易记录、余额快照表统一在本数据库管理
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  # 项目自有只读参考包：SHA256 校验及 SQLite 点查
  crypto: ^3.0.7
  sqlite3: ^3.5.2
  # 卡片档案 ID 生成
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 测试用：生成二维码图案
  qr: ^4.0.0
  # Drift 代码生成：dart run build_runner build --delete-conflicting-outputs
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/TrafArch_Database_TU.sqlite
    - assets/data/TrafArch_Database_CU.sqlite
    - assets/data/reference_manifest.json
    - assets/dictionaries/
    - assets/icon/
